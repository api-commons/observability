overlay: 1.0.0
info:
  title: Observability -- otlp-1 alignment
  version: 0.1.0-draft.20261111
  description: Marks the common Observability OpenAPI with the otlp-1 object each schema corresponds to, and the field each
    property maps to. Generated by scripts/overlay.py from standards/otlp-1.yml; nothing is renamed.
extends: openapi.yml
actions:
- target: $.components.schemas.Trace
  update:
    x-commons-standard:
      standard: otlp-1
      source: https://github.com/open-telemetry/opentelemetry-proto
      objects:
      - Span
      - Status
      core_coverage: 1.0
      fields:
        trace_id: trace_id
        span_id: span_id
        trace_state: trace_state
        parent_span_id: parent_span_id
        flags: flags
        name: name
        kind: kind
        start_time_unix_nano: start_time_unix_nano
        end_time_unix_nano: end_time_unix_nano
        metadata: attributes
        dropped_attributes_count: dropped_attributes_count
        events: events
        dropped_events_count: dropped_events_count
        dropped_links_count: dropped_links_count
        status: status
      standard_only:
      - links
      - message
      - code
- target: $.components.schemas.Log
  update:
    x-commons-standard:
      standard: otlp-1
      source: https://github.com/open-telemetry/opentelemetry-proto
      objects:
      - LogRecord
      core_coverage: null
      fields:
        time_unix_nano: time_unix_nano
        observed_time_unix_nano: observed_time_unix_nano
        severity_number: severity_number
        severity_text: severity_text
        message: body
        metadata: attributes
        dropped_attributes_count: dropped_attributes_count
        flags: flags
        trace_id: trace_id
        span_id: span_id
      standard_only:
      - event_name
