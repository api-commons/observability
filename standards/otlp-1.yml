standard: otlp-1
source: https://github.com/open-telemetry/opentelemetry-proto
concepts:
  trace:
    objects:
    - Span
    - Status
    core_coverage: 1.0
    extended_coverage: 0.5
    core_missing_from_standard: []
    crosswalk:
      trace_id: trace_id
      span_id: span_id
      trace_state: trace_state
      parent_span_id: parent_span_id
      flags: flags
      name: name
      kind: kind
      start_time_unix_nano: start_time_unix_nano
      end_time_unix_nano: end_time_unix_nano
      metadata: attributes
      dropped_attributes_count: dropped_attributes_count
      events: events
      dropped_events_count: dropped_events_count
      dropped_links_count: dropped_links_count
      status: status
    standard_only:
    - links
    - message
    - code
  log:
    objects:
    - LogRecord
    core_coverage: null
    extended_coverage: 0.286
    core_missing_from_standard: []
    crosswalk:
      time_unix_nano: time_unix_nano
      observed_time_unix_nano: observed_time_unix_nano
      severity_number: severity_number
      severity_text: severity_text
      message: body
      metadata: attributes
      dropped_attributes_count: dropped_attributes_count
      flags: flags
      trace_id: trace_id
      span_id: span_id
    standard_only:
    - event_name
defines_unpublished: {}
